name: Verify Browser Evidence

# Reproducible browser-evidence tier (GO-2 / GO-7, docs/audit/02-ASSESSMENT.md).
# Runs separately from the main Verify gate so a missing hosted fixture or
# flaky local browser never blocks merges; it is the signal that committed
# artifacts under artifacts/browser-* may have drifted from current behavior.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start authority (wrangler --local) and app
        run: |
          npm run authority:dev > /tmp/authority.log 2>&1 &
          npm run dev > /tmp/app.log 2>&1 &
          npx wait-on tcp:8787 tcp:5188 --timeout 120000
      - run: npm run test:browser:all
