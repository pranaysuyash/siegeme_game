name: Verify Browser Evidence

# Reproducible browser-evidence tier (GO-2 / GO-7, docs/audit/02-ASSESSMENT.md).
# Runs separately from the main Verify gate so browser evidence has its own
# timeout and artifact surface. The isolated runner owns both local servers,
# migrations, secrets, and temporary persistence, so CI does not depend on a
# developer port, an unconfigured production binding, or a shared fixture.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:isolated
