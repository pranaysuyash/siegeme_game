name = "siegeme-authority"
main = "src/index.ts"
compatibility_date = "2026-08-04"

[vars]
DODO_PAYMENTS_ENVIRONMENT = "test_mode"

[[d1_databases]]
binding = "DB"
database_name = "siegeme-ledger"
database_id = "80f7bb80-d8ce-4266-a5e3-e7adc23572b5"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "RULER_ASSETS"
bucket_name = "siegeme-ruler-assets"

[durable_objects]
bindings = [
  { name = "GLOBAL_SIEGE", class_name = "SiegeWorld" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiegeWorld"]
